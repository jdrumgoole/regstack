name: publish

# Pushing a `vX.Y.Z` tag triggers a build and an OIDC-trusted publish to PyPI.
# Configure the PyPI project (https://pypi.org/manage/account/publishing/)
# with the publisher: this repository, environment name `pypi`, workflow
# `publish.yml`. No PyPI tokens live in GitHub Actions secrets.
#
# Third-party actions are pinned to commit SHAs (not mutable tags) so a
# tag swap upstream can't substitute a malicious version. Update by
# resolving the latest SHA for the version you want and bumping the
# trailing `# vN` comment to match.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Workflow-level default. Individual jobs override where they need
# extra scopes (the `publish` job adds `id-token: write` for OIDC).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - run: uv python pin 3.11

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF##*/}"            # e.g. v0.1.0
          tag_version="${tag#v}"             # e.g. 0.1.0
          # Read version from pyproject.toml directly — importing the package
          # would pull in optional-extra dependencies (e.g. pymongo) that
          # aren't installed in this build job.
          pkg_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag does not match package version $pkg_version" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/regstack
    permissions:
      id-token: write   # OIDC trusted-publisher exchange
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # Pinned to a commit SHA, not the mutable `release/v1` branch — the
      # publish job has `id-token: write`, so a tag/branch swap in the
      # action repo would let an attacker push a malicious wheel under our
      # OIDC identity. Update by resolving the latest SHA on `release/v1`
      # and bumping the trailing comment to match.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
