[project]
name = "regstack"
version = "0.8.6"
description = "Embeddable user registration, login, and account management for FastAPI apps. SQLite / Postgres / MongoDB."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
keywords = ["fastapi", "mongodb", "auth", "registration", "users"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # fastapi>=0.120.0 picks up CVE-2025-62727 (Starlette DoS via large
    # request bodies after multipart processing).
    # CVE-2026-2978 / CVE-2026-2979 (flagged for monitoring in the
    # 2026-05-22 security review, I-2) affect the third-party
    # "FastApiAdmin" project, not fastapi itself — no floor bump needed.
    "fastapi>=0.120.0",
    # starlette>=1.3.1 closes a four-CVE cluster affecting 1.0.0–1.3.0:
    # CVE-2026-48710 ("BadHost" — malformed Host header bypasses path-
    # based auth; fixed in 1.0.1), CVE-2026-48818 (Windows StaticFiles
    # UNC path leaks NTLMv2 hash; fixed in 1.1.0), CVE-2026-54282
    # (attacker-controlled request.url.hostname via non-/ path; fixed in
    # 1.3.0), and CVE-2026-54283 (x-www-form-urlencoded ignores
    # max_fields/max_part_size — unauthenticated DoS; fixed in 1.3.1).
    # regstack itself doesn't route auth off request.url.path but ships
    # Starlette transitively to every host. Pulled in by fastapi; pinned
    # directly so the floor is explicit.
    "starlette>=1.3.1",
    "pydantic>=2.6",
    # pydantic-settings>=2.14.2 closes CVE-2026-32690 (CWE-22:
    # validate_secrets_path() size-check skips symlinked dirs, enabling
    # secrets_dir_max_size bypass) and CVE-2026-58203 (CWE-59:
    # NestedSecretsSettingsSource follows symlinks outside the configured
    # secrets tree). RegStackConfig extends BaseSettings.
    "pydantic-settings>=2.14.2",
    "pwdlib[argon2]>=0.2.1",
    # pyjwt>=2.13.0 includes the fix for CVE-2026-32597 (`crit` header
    # bypass) plus the June-2026 PyJWKClient cluster: CVE-2026-48522
    # (SSRF via PyJWKClient URI-scheme handling), CVE-2026-48523
    # (algorithm allow-list bypass on get_signing_key_from_jwt),
    # CVE-2026-48524 (fresh JWKS fetch on every cache miss — connection-
    # pool exhaustion under load), CVE-2026-48525 (unauthenticated DoS in
    # detached-payload JWS), and CVE-2026-48526 (algorithm confusion via
    # a public JWK used as an HMAC secret). The OAuth ID-token path uses
    # exactly get_signing_key_from_jwt + decode, so 48523/48526 are
    # directly on regstack's verification code path.
    "pyjwt>=2.13.0",
    # jinja2>=3.1.6 picks up CVE-2025-27516 (sandbox breakout via the
    # `|attr` filter; only relevant if hosts allow user-controlled
    # templates, but we tighten the floor anyway).
    "jinja2>=3.1.6",
    "click>=8.1",
    "dnspython>=2.6",
    # python-multipart>=0.0.32 closes a six-CVE cluster: CVE-2026-40347
    # (DoS via oversized multipart preamble), CVE-2026-42561 (DoS via
    # unbounded part-header count/size, CVSS 7.5), CVE-2026-53537 (RFC
    # 2231/5987 Content-Disposition header smuggling), CVE-2026-53538
    # (`;`-separator WAF bypass — parameter smuggling), CVE-2026-53539
    # (CVSS 7.5 — QuerystringParser O(B²) DoS with `;` separators,
    # directly reachable via login/register), and CVE-2026-53540 (negative
    # Content-Length read-until-EOF — memory DoS). >=0.0.32 is the first
    # version clear of all six CVEs.
    "python-multipart>=0.0.32",
    "email-validator>=2.1",
    # aiosmtplib>=5.1.1 closes CVE-2026-53533 (SMTP command injection,
    # CVSS 6.5): SMTP.mail()/rcpt()/vrfy()/expn() did not reject C0
    # control characters (including CR/LF) in caller-supplied addresses,
    # allowing wire-level SMTP command injection below Jinja2 rendering.
    # Practical risk is reduced by EmailStr validation rejecting literal
    # CR/LF, but the floor must be correct.
    "aiosmtplib>=5.1.1",
    # SQL stack — bundled by default because SQLite is the default backend.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mongo = ["pymongo>=4.9"]
# SecantusDB speaks the MongoDB wire protocol, so the `mongo` backend
# drives it unchanged and a daemon deployment needs nothing beyond
# pymongo. This extra is for *embedding* the server in-process — the
# shape the test suite uses, and useful to hosts that want an
# auth database with no separate mongod to run.
secantus = ["pymongo>=4.9", "SecantusDB>=0.6.0b2"]
ses = ["aioboto3>=12.3"]
sns = ["aioboto3>=12.3"]
twilio = ["twilio>=9.0"]
# cryptography>=48.0.1 closes CVE-2026-26007 (ECC subgroup attack on the
# JWKS code path), CVE-2026-34073, CVE-2026-39892, and CVE-2026-45447
# (heap use-after-free in PKCS7_verify() triggered by a crafted empty
# digestAlgorithms SET in a PKCS#7/S/MIME message — CVSS 7.5). The
# previous floor (>=46.0.7) locked to 47.0.0 which is in the affected
# range; 48.0.1 is the first clean release.
oauth = ["pyjwt[crypto]>=2.13.0", "cryptography>=48.0.1"]
# Interactive setup wizards (`regstack oauth setup`, `regstack theme
# design`). These open a native pywebview window over a local 127.0.0.1
# FastAPI server and use tomlkit for non-destructive TOML merging.
# Optional because library consumers who never run the GUI tools don't
# need a platform browser engine pulled in by pywebview.
wizard = [
    "pywebview>=5.0",
    "tomlkit>=0.13",
    "uvicorn[standard]>=0.29",
]
# Per-route rate limiting on the auth router. The limiter itself can be
# host-supplied (so hosts that already use slowapi share the same Limiter
# state), otherwise regstack constructs an in-memory one.
rate_limit = [
    "slowapi>=0.1.9",
]
docs = [
    "sphinx>=7.3",
    "myst-parser>=3.0",
    "furo>=2024.1",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "anyio>=4.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "invoke>=2.2",
    "uvicorn[standard]>=0.29",
    # All backend drivers in dev so the parametrized test suite can run.
    "pymongo>=4.9",
    "asyncpg>=0.29",
    # Embedded MongoDB-compatible server for the `secantus` parametrization.
    # No wheel for macOS x86_64 (arm64 only), so the marker keeps an Intel
    # Mac's `uv sync --extra dev` from trying to build WiredTiger from
    # source. PEP 508 markers have no boolean NOT, hence the De Morgan form.
    "SecantusDB>=0.6.0b2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # OAuth provider tests need the crypto bits to verify ID tokens.
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=48.0.1",
    # E2E tests for the OAuth setup wizard (drives the SPA in headless Chromium).
    "pytest-playwright>=0.5",
    # Rate-limit tests exercise the slowapi integration.
    "slowapi>=0.1.9",
    # Wizard surface (now an optional `wizard` extra) — tests exercise
    # the setup/theme-designer routes, writers, and Playwright e2e.
    "pywebview>=5.0",
    "tomlkit>=0.13",
    # Optional email/SMS backend drivers, in dev so the coverage run
    # actually exercises the SES/SNS/Twilio code paths (and the SES setup
    # wizard) instead of skipping them on a missing import.
    "aioboto3>=12.3",
    "twilio>=9.0",
]

[project.scripts]
regstack = "regstack.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/jdrumgoole/regstack"
Repository = "https://github.com/jdrumgoole/regstack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regstack"]
# Hatch's package autodiscovery already picks up template / static assets
# under src/regstack — no force-include needed (it would double-pack).

[tool.hatch.build.targets.sdist]
# Hatchling's sdist default includes every git-tracked file. Without this
# block the published source tarball ships internal planning docs,
# security-review prompts, the full test suite, and CI configuration to
# anyone who runs `pip download --no-binary`. The wheel target above is
# already tight (src/regstack only); this list is the matching sdist
# discipline. Flagged as W-2 in the 2026-05-15 / 2026-05-16 security
# reviews — CLAUDE.md in particular contains a developer home path.
exclude = [
    ".git",
    ".github/",
    ".python-version",
    ".readthedocs.yaml",
    "CLAUDE.md",
    "docs/",
    "examples/",
    "scripts/",
    "tasks.py",
    "tasks/",
    "tests/",
    "uv.lock",
]
# Note on `.git`: hatchling normally skips it because it's a directory, but
# when this repo is built from a git *worktree* (e.g. release prep on a
# branch), `.git` is a 1-line text file containing an absolute path to the
# primary repo's worktrees dir — which leaks the developer's home directory
# into PyPI. Excluding it explicitly is harmless for non-worktree builds.

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "e2e: end-to-end Playwright tests (run serially, slow)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    # uvicorn[standard] still imports websockets.legacy on shutdown,
    # which fires a DeprecationWarning. The wizard's e2e fixture runs
    # uvicorn in a thread and pytest's threadexception plugin promotes
    # thread warnings to errors — silence at the source.
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:uvicorn.*",
    # Starlette >=1.3 (now pinned at the starlette>=1.3.1 CVE floor)
    # deprecates its TestClient's use of `httpx` in favour of `httpx2`.
    # This is a test-client-only deprecation — the production ASGI path
    # is unaffected — so we silence it rather than cap the floor (an
    # upper bound would deny hosts future framework fixes). Revisit when
    # migrating the TestClient to httpx2.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # CI surfaces PytestUnraisableExceptionWarning when async fixtures
    # from a previous test leak sockets/event loops past their cleanup
    # window — the sync UI tests shouldn't fail just because asyncpg or
    # aiosqlite teardown was sloppy in a sibling test.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",
    # `Depends(...)` in argument defaults is the canonical FastAPI pattern.
    "B008",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# The Twilio SDK ships no py.typed marker and is an optional extra, so the
# lazy import inside SmsService raises a different error code depending on
# whether the extra happens to be installed (`import-not-found` without it,
# `import-untyped` with it). An inline ignore can only be right for one of
# those; the module override is right for both.
[[tool.mypy.overrides]]
module = ["twilio.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/regstack"]
branch = true
parallel = true
# `concurrency = ["thread"]` is implicit; pytest-xdist workers each write
# their own .coverage.<host>.<pid>.<token> file and `coverage combine`
# folds them together — see the `coverage` invoke task.
omit = [
    # Native pywebview window-launch shims. Each opens a desktop window over
    # a local uvicorn server; there is no headless test path, so counting
    # them only depresses the number with no way to improve it. The route
    # handlers, validators, and writers behind each window ARE tested.
    "*/wizard/*/window.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",                   # body-less Protocol methods
]

[tool.coverage.html]
directory = "htmlcov"
